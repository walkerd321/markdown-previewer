<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Previewer</title>
    <script>
      (() => {
        const theme = localStorage.getItem("markdown-previewer-theme");
        document.documentElement.dataset.theme = ["system", "light", "dark"].includes(theme) ? theme : "system";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">M↓</span>
          <span class="brand-name">Markdown Previewer</span>
          <span id="appVersion" class="app-version" aria-label="Version 2.0.0">v2.0.0</span>
        </div>
        <div class="actions">
          <label class="sr-only" for="themeSelect">Color theme</label>
          <select id="themeSelect" class="theme-select">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <button id="importMarkdown" class="button" type="button">Import .md</button>
          <input id="markdownFile" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
          <button id="copyHtml" class="button" type="button">Copy HTML</button>
          <button id="downloadHtml" class="button button-primary" type="button">Download .html</button>
        </div>
      </header>

      <section id="workspace" class="workspace" aria-label="Markdown editor and preview">
        <div id="editorPane" class="pane editor-pane">
          <div class="pane-header editor-header">
            <span>MARKDOWN</span>
            <div class="editor-header-tools">
              <span id="draftStatus" class="meta">Saved locally</span>
              <span class="shortcut-help">Ctrl/⌘ B bold · I italic · K link · S save</span>
              <button id="downloadMarkdown" class="text-button" type="button" title="Download Markdown (Ctrl/⌘+S)">Download .md</button>
              <button id="clear" class="text-button" type="button">Clear</button>
            </div>
          </div>
          <textarea id="markdown" spellcheck="true" aria-label="Markdown input"></textarea>
          <div class="drop-hint" aria-hidden="true">Drop a Markdown file to import</div>
        </div>

        <div
          id="resizeHandle"
          class="divider"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          aria-label="Resize editor and preview"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-valuenow="50"
        ></div>

        <article class="pane preview-pane">
          <div class="pane-header">
            <span>PREVIEW</span>
            <span id="wordCount" class="meta"></span>
          </div>
          <div id="preview" class="preview"></div>
        </article>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
