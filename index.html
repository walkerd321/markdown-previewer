<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4c61dd" />
    <meta name="description" content="A private, offline-ready Markdown editor with live preview and document quality checks." />
    <meta property="og:title" content="Markdown Previewer" />
    <meta property="og:description" content="Edit, preview, check, and export Markdown locally in your browser." />
    <meta property="og:type" content="website" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>Markdown Previewer</title>
    <script>
      (() => {
        const theme = localStorage.getItem("markdown-previewer-theme");
        document.documentElement.dataset.theme = ["system", "light", "dark"].includes(theme) ? theme : "system";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=2.4.0" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">M↓</span>
          <span class="brand-name">Markdown Previewer</span>
          <span id="appVersion" class="app-version" aria-label="Version 2.4.0">v2.4.0</span>
        </div>
        <div class="document-controls" aria-label="Draft management">
          <label class="sr-only" for="draftSelect">Draft</label>
          <select id="draftSelect" class="draft-select"></select>
          <label class="sr-only" for="draftName">Draft name</label>
          <input id="draftName" class="draft-name" type="text" maxlength="80" value="Untitled" aria-label="Draft name" />
          <button id="newDraft" class="text-button" type="button" title="Create a new draft">New</button>
          <label class="sync-scroll-control" title="Synchronize editor and preview scrolling">
            <input id="syncScroll" type="checkbox" />
            Sync scroll
          </label>
          <button id="focusMode" class="text-button" type="button" aria-pressed="false">Focus</button>
        </div>
        <div class="actions">
          <label class="sr-only" for="themeSelect">Color theme</label>
          <select id="themeSelect" class="theme-select">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
          <button id="importMarkdown" class="button" type="button">Import .md</button>
          <input id="markdownFile" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
          <button id="copyHtml" class="button" type="button">Copy HTML</button>
          <button id="downloadHtml" class="button" type="button">Download .html</button>
          <button id="downloadMarkdown" class="button button-primary" type="button" title="Save Markdown file (Ctrl/⌘+S)">Save .md</button>
        </div>
      </header>

      <section id="workspace" class="workspace" aria-label="Markdown editor and preview">
        <div id="editorPane" class="pane editor-pane">
          <div class="pane-header editor-header">
            <span>MARKDOWN</span>
            <div class="editor-header-tools">
              <span id="draftStatus" class="meta">Saved locally</span>
              <span class="shortcut-help">Ctrl/⌘ B bold · I italic · K link · S save</span>
              <button id="findToggle" class="text-button" type="button" aria-expanded="false" aria-controls="findReplacePanel">Find</button>
              <button id="clear" class="text-button" type="button">Clear</button>
            </div>
          </div>
          <section id="findReplacePanel" class="find-replace-panel" aria-label="Find and replace" hidden>
            <label for="findInput">Find</label>
            <input id="findInput" type="search" autocomplete="off" />
            <label for="replaceInput">Replace</label>
            <input id="replaceInput" type="text" autocomplete="off" />
            <button id="findPrevious" class="text-button" type="button" aria-label="Previous match">Previous</button>
            <button id="findNext" class="text-button" type="button" aria-label="Next match">Next</button>
            <button id="replaceOne" class="text-button" type="button">Replace</button>
            <button id="replaceAll" class="text-button" type="button">All</button>
            <span id="findStatus" class="meta" aria-live="polite"></span>
          </section>
          <textarea id="markdown" spellcheck="true" aria-label="Markdown input"></textarea>
          <div class="drop-hint" aria-hidden="true">Drop a Markdown file to import</div>
        </div>

        <div
          id="resizeHandle"
          class="divider"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          aria-label="Resize editor and preview"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-valuenow="50"
          title="Drag to resize; double-click or press Home to reset"
        ></div>

        <article class="pane preview-pane">
          <div class="pane-header preview-header">
            <span>PREVIEW</span>
            <div class="preview-header-tools">
              <button
                id="outlineToggle"
                class="text-button"
                type="button"
                aria-expanded="false"
                aria-controls="outlinePanel"
              >Outline</button>
              <button
                id="qualityToggle"
                class="text-button"
                type="button"
                aria-expanded="false"
                aria-controls="qualityPanel"
              >Quality check</button>
              <button id="printPreview" class="text-button" type="button">Print</button>
              <span id="wordCount" class="meta"></span>
            </div>
          </div>
          <section id="qualityPanel" class="quality-panel" aria-label="Markdown quality results" hidden>
            <div id="qualitySummary" class="quality-summary" role="status" aria-live="polite"></div>
            <ul id="qualityResults" class="quality-results"></ul>
          </section>
          <nav id="outlinePanel" class="outline-panel" aria-label="Document outline" hidden>
            <ol id="outlineResults" class="outline-results"></ol>
          </nav>
          <div id="preview" class="preview"></div>
        </article>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script type="module" src="app.js?v=2.4.0"></script>
  </body>
</html>
